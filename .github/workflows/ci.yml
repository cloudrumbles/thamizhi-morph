name: ci

on:
  pull_request:
  push:
    branches: [master, "codex/**"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,api]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=thamizhi_morph --cov-report=term-missing

  foma-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install --yes foma
      - run: python -m pip install -e .
      - run: thamizhi-morph doctor --json
      - run: thamizhi-morph analyze தமிழ் --format json --no-guessers
      - run: thamizhi-morph benchmark test-data/Grade1-Unique-Wordlist --limit 50

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: thamizhi-morph:test

  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create source snapshot
        run: git archive --format=tar.gz --output=thamizhi-morph-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: source-tree
          path: thamizhi-morph-source.tar.gz
          retention-days: 1
