name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Foma
        run: |
          sudo apt-get update
          sudo apt-get install --yes foma
      - name: Install package
        run: python -m pip install --upgrade -e '.[dev,api]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Verify wheel contents and CLI
        run: |
          python -m pip install --force-reinstall dist/*.whl
          thamizhimorph --version
          python - <<'PY'
          from thamizhimorph.resources import default_model_dir, load_model_specs
          exact, guessers = load_model_specs()
          missing = [m.filename for m in (*exact, *guessers) if not (default_model_dir() / m.filename).is_file()]
          if missing:
              raise SystemExit(f"missing packaged models: {missing}")
          PY

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --tag thamizhimorph:ci .
      - name: Smoke-test API
        run: |
          docker run --detach --name thamizhimorph-ci --publish 127.0.0.1:8000:8000 thamizhimorph:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health > health.json; then
              break
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path("health.json").read_text())
          if not health.get("ready"):
              raise SystemExit(f"container is not ready: {health}")
          PY
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"tokens":["தமிழ்"],"use_guessers":false}' \
            http://127.0.0.1:8000/v1/analyze > analysis.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("analysis.json").read_text())["tokens"][0]
          if result["status"] != "exact" or not result["analyses"]:
              raise SystemExit(f"unexpected analysis response: {result}")
          PY
      - name: Show logs and stop container
        if: always()
        run: |
          docker logs thamizhimorph-ci || true
          docker rm --force thamizhimorph-ci || true
