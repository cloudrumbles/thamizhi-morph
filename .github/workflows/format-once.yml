name: format-once

on:
  push:
    branches: ["codex/thamizhi-morph-v2"]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run one-time formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.5
      - run: ruff format .
      - name: Commit formatting
        run: |
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format Python sources"
          git push origin HEAD:${{ github.ref_name }}
