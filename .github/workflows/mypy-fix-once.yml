name: mypy-fix-once

on:
  push:
    branches: ["codex/thamizhi-morph-v2"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      PATCH_B64: >-
        
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply patch and commit
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > /tmp/mypy-fix.patch
          git apply --check /tmp/mypy-fix.patch
          git apply /tmp/mypy-fix.patch
          python -m compileall -q src tests
          rm .github/workflows/mypy-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make the modern runtime strictly typed"
          git push origin HEAD:${{ github.ref_name }}
